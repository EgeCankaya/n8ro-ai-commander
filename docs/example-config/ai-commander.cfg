# Example deployed configuration for the AI Entity Commander.
#
# Copy to  <N8RO_RELEASE>\data\config\plugins\ai-commander.cfg  and edit.
#
# IMPORTANT: `commander.enabled` ships FALSE here on purpose. The deployment checklist requires
# the deployed default config to have both commander.enabled and claude.enabled false; enabling
# the commander is a positive act an operator takes, not a state a deploy leaves behind.
#
# WHICH HOSTS READ THIS (changed in PRD v1.7.2 - read this if you remember the old behaviour):
#
# BOTH of them, now. The plugin reads this file itself at initialize(), as its DEFAULT source, and
# applies it through the same all-or-nothing path the config editor uses.
#
#   - UI host: applies it through the plugin config editor -> applyConfigFields(). Unchanged.
#   - Headless `n8ro-sim-local.exe`: the HOST still applies no per-plugin config (observed:
#     n8ro-plugin-settings.cfg lists `n8ro-skyfeed=false` and skyfeed loads anyway) - but the
#     PLUGIN now reads this file, so `commander.enabled` here DOES take effect on a headless run.
#
# Before v1.7.2 it did not, which made the in-engine live smoke and the H1 paired runs impossible
# to automate; both were recorded as unmet Phase 1b gate items for exactly that reason.
#
# PRECEDENCE: an explicit applyConfigFields() always wins, in either call order. If a host applies
# configuration before initialize(), this file is not read at all - a host-supplied configuration
# is never silently replaced by a deployed default.
#
# CONSEQUENCE YOU MUST KNOW ABOUT: a stale copy of this file left in a release tree now takes
# effect on automated runs too, not just interactive ones. The deployment checklist has a row for
# it. Every run logs which file it read and how many fields it applied - or that it found none -
# in the first few plugin lines. Check that line rather than assuming.
#
# FORMAT: flat name=value, one per line, the same shape as the release tree's other per-plugin
# config files. `#` comment lines, blank lines, and surrounding whitespace are ignored; an empty
# value means empty (see replay.path and claude.effort below), not "leave alone". An unknown field
# name is ignored rather than rejected, so a config written for a newer build does not brick an
# older one. One INVALID value rejects the WHOLE file - nothing is partially applied.
#
# The path is fixed at data/config/plugins/ai-commander.cfg, resolved against the HOST's working
# directory (the release root). It is not itself configurable: a configurable config path has no
# bootstrap.

# -- master switches ---------------------------------------------------------------------------
commander.enabled=false
commander.backend=stub

# -- cadence and bounds ------------------------------------------------------------------------
commander.cadenceS=20
commander.maxCommandedEntities=4
commander.maxConcurrentRequests=1
# Sized for a COLD MODEL LOAD, not steady state. A warm 7B answers in ~1.7 s, but the first
# request after Ollama evicts the model measured 22-46 s. A 30 s timeout fails the first order of
# every run, reliably. See the PRD, Corrections item 10.
commander.requestTimeoutS=90
commander.maxOrderAgeS=45
commander.orderValidityS=120
commander.releaseAfterS=300
commander.maxTracksInPrompt=8

# -- prompt ------------------------------------------------------------------------------------
# Read once at initialize(); a change mid-run does not take effect, which is what preserves
# prompt-prefix byte stability across a run.
#
# RESOLVED AGAINST THE HOST'S WORKING DIRECTORY - the release root - NOT against the DLL. Nothing
# in the release tree ships this file, so a deployed plugin finds nothing there unless it is put
# there, and a missing doctrine degrades order quality SILENTLY: no counter moves, no order is
# rejected, the prefix just carries "(none provided)". This went unnoticed from Phase 0 through the
# Phase 1a gate (PRD Corrections item 16).
#
# The plugin's post-build event now seeds data/doctrine.txt into the release tree if it is absent,
# and initialize() logs which file it loaded and how many bytes - or a WARNING naming the path it
# could not find. Check for that line on any run whose order quality looks poor.
prompt.doctrinePath=data/doctrine.txt

# -- local backend (Phase 1b; IMPLEMENTED) -----------------------------------------------------
# Backend resolved to Ollama (PRD OQ-1). local.model is an OLLAMA TAG, not a GGUF filename - the
# shipped .gguf files need no import, and naming one here fails with model-not-found.
# List what is available with:  ollama list
local.baseUrl=http://localhost:11434
local.model=qwen2.5:7b-instruct-q8_0
local.temperature=0
# Sends the embedded order schema as Ollama's `format` parameter. Not GBNF - Ollama's JSON-Schema
# enforcement is the equivalent.
#
# It DOES now hold the conditional-presence rules, which it did not before the schema was expressed
# as oneOf over four posture-discriminated branches (PRD v1.7.1, Corrections items 13 and 15).
# Measured with it on: reject.shape 0.00 % over 200 orders. Measured with a flat schema: 83 %.
# Stage-A A6 still enforces the same rules independently - the decoder is a second line, not a
# substitute.
#
# Set false ONLY to reproduce an unconstrained baseline for H3. The plugin logs a warning when you
# do, because with it off the majority of orders are rejected `shape` and the run measures nothing
# a demo should be judged on.
local.grammarEnabled=true

# -- hosted backend (Phase 2; not implemented in this build) -----------------------------------
# claude.enabled is an INDEPENDENT authorization gate. Setting commander.backend=claude while
# this is false is rejected outright rather than silently falling back to local - a silent
# fallback would teach operators that the switch does not matter.
claude.enabled=false
claude.baseUrl=https://api.anthropic.com
claude.model=claude-haiku-4-5

# MODEL-SHAPED, like claude.effort below. Range [1, 8192]. 512 is sized for the model named above:
# over 120 orders Haiku 4.5 peaked at 127 tokens, 4.0x headroom. It is NOT safe for a more verbose
# model - Sonnet 5 truncated 4 of 48 orders at this value, and truncation does not announce itself
# as a length error: the response is cut mid-JSON and rejected `parse` or `envelope`, which reads
# like bad order quality in a table. If you change claude.model, measure that model's output length
# before trusting this number.
#
# Measured for Sonnet 5 (2026-08-04, 48 orders): max 673 tokens, mean 272, 15 % above 512. That max
# is a SAMPLE max, not a bound - per-situation means moved by up to 71 tokens between two runs of
# the identical configuration - so allow headroom over it rather than setting it to 673.
claude.maxTokens=512
# The NAME of an environment variable, never the value. The value is read at request time and is
# never persisted, never logged, and never returned by getConfigFields().
claude.apiKeyEnvVar=ANTHROPIC_API_KEY
claude.effort=

# -- the spend ceiling (AIC-BE-2, PRD v1.8.47, C24) ---------------------------------------------
#
# Cumulative USD for the life of ONE ENGINE PROCESS. On reaching it the hosted backend LATCHES OFF
# and sends nothing further for the life of that process; the exhaustion is logged once and every
# refusal names the budget, so a budget stop can never be mistaken for a backend outage.
#
# IT FAILS CLOSED. A value at or below zero DISABLES the hosted backend - it does NOT mean
# "unlimited". That is deliberate and it is the opposite of the usual convention: the failure mode
# of an unset, zeroed or mis-parsed field has to be "sends nothing", never "sends without limit",
# because a typo must not become unbounded egress.
#
# 1.00 is roughly 2.3 hours of two-entity commanding at the measured per-order cost.
#
# WHAT IT DOES NOT BOUND: running the engine a hundred times. It is per-process, and that is
# deliberate - starting a run is a human act, and that per-run checkpoint is the control which
# covers repetition. A cross-process counter would live in a file an operator can delete, and a
# control that can be reset by deleting a file is worse than none because it reads as a control.
claude.maxSpendUsd=1.00

# The unit prices the ceiling is computed with, in USD per million tokens. THESE ARE CONFIGURATION
# AND NOT CONSTANTS, because claude.model above is operator-settable: a price compiled into the
# adapter is a number nothing keeps in step with the model it prices. IF YOU CHANGE claude.model,
# CHANGE THESE TOO. The defaults are claude-haiku-4-5's rates as used throughout the PRD cost model.
claude.priceInPerMTok=1.00
claude.priceOutPerMTok=5.00
claude.priceCacheReadPerMTok=0.10
claude.priceCacheWritePerMTok=1.25

# -- safety envelope (Stage-B clamp bounds) ----------------------------------------------------
# Review these against the operating envelope of the scenario you are running. They are reject
# bounds, not clamp-and-accept bounds: an order outside them is discarded whole.
safety.maxSpeedMps=400
safety.minAltitudeHaeM=100
safety.maxAltitudeHaeM=20000
safety.geofenceRadiusM=200000
safety.defaultOrbitRadiusM=8000

# -- order log ---------------------------------------------------------------------------------
# On by default: replay and post-run investigation both depend on it. The log carries live
# scenario state and inherits the release tree's classification - see the repository .gitignore.
record.enabled=true
record.path=logs/ai-commander/

# Required when commander.backend=replay; ignored otherwise.
replay.path=
