# Example deployed configuration for the AI Entity Commander.
#
# Copy to  <N8RO_RELEASE>\data\config\plugins\ai-commander.cfg  and edit.
#
# IMPORTANT: `commander.enabled` ships FALSE here on purpose. The deployment checklist requires
# the deployed default config to have both commander.enabled and claude.enabled false; enabling
# the commander is a positive act an operator takes, not a state a deploy leaves behind.
#
# NOTE ON WHICH HOST READS THIS: the headless `n8ro-sim-local.exe` does not apply per-plugin
# config - it loads every DLL it finds and leaves each plugin on its compiled-in defaults.
# (Observed: n8ro-plugin-settings.cfg lists `n8ro-skyfeed=false` and skyfeed loads anyway.)
# Applying this file is the UI host's job, through the plugin config editor, which calls
# applyConfigFields(). Setting commander.enabled here has no effect on a headless run.

# -- master switches ---------------------------------------------------------------------------
commander.enabled=false
commander.backend=stub

# -- cadence and bounds ------------------------------------------------------------------------
commander.cadenceS=20
commander.maxCommandedEntities=4
commander.maxConcurrentRequests=1
# Sized for a COLD MODEL LOAD, not steady state. A warm 7B answers in ~1.7 s, but the first
# request after Ollama evicts the model measured 22-46 s. A 30 s timeout fails the first order of
# every run, reliably. See the PRD, Corrections item 10.
commander.requestTimeoutS=90
commander.maxOrderAgeS=45
commander.orderValidityS=120
commander.releaseAfterS=300
commander.maxTracksInPrompt=8

# -- prompt ------------------------------------------------------------------------------------
# Read once at initialize(); a change mid-run does not take effect, which is what preserves
# prompt-prefix byte stability across a run.
prompt.doctrinePath=data/doctrine.txt

# -- local backend (Phase 1b; not implemented in this build) -----------------------------------
# Backend resolved to Ollama (PRD OQ-1). local.model is an OLLAMA TAG, not a GGUF filename - the
# shipped .gguf files need no import, and naming one here fails with model-not-found.
# List what is available with:  ollama list
local.baseUrl=http://localhost:11434
local.model=qwen2.5:7b-instruct-q8_0
local.temperature=0
# Sends the embedded order schema as Ollama's `format` parameter. Not GBNF - Ollama's JSON-Schema
# enforcement is the equivalent. Note it secures types and enums but NOT the conditional-presence
# rules (orbitRadiusM only on hold, target only on engage/crank); Stage-A shape checks do that.
local.grammarEnabled=true

# -- hosted backend (Phase 2; not implemented in this build) -----------------------------------
# claude.enabled is an INDEPENDENT authorization gate. Setting commander.backend=claude while
# this is false is rejected outright rather than silently falling back to local - a silent
# fallback would teach operators that the switch does not matter.
claude.enabled=false
claude.baseUrl=https://api.anthropic.com
claude.model=claude-haiku-4-5
claude.maxTokens=512
# The NAME of an environment variable, never the value. The value is read at request time and is
# never persisted, never logged, and never returned by getConfigFields().
claude.apiKeyEnvVar=ANTHROPIC_API_KEY
claude.effort=

# -- safety envelope (Stage-B clamp bounds) ----------------------------------------------------
# Review these against the operating envelope of the scenario you are running. They are reject
# bounds, not clamp-and-accept bounds: an order outside them is discarded whole.
safety.maxSpeedMps=400
safety.minAltitudeHaeM=100
safety.maxAltitudeHaeM=20000
safety.geofenceRadiusM=200000
safety.defaultOrbitRadiusM=8000

# -- order log ---------------------------------------------------------------------------------
# On by default: replay and post-run investigation both depend on it. The log carries live
# scenario state and inherits the release tree's classification - see the repository .gitignore.
record.enabled=true
record.path=logs/ai-commander/

# Required when commander.backend=replay; ignored otherwise.
replay.path=
